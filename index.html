/* The divisibility rules worth knowing, in the order they are worth trying.
   These SAY what fits and stop there.  Working out the quotient is the
   student's job, so no rule here ever divides anything. */
function digitSum(n){return String(n).split("").reduce(function(s,c){return s+ +c;},0);}
const RULES=[
    {p:2,both:function(a,b){return a+" and "+b+" both end in an even digit";},
         no:function(n){return n+" is odd";}},
    {p:3,both:function(a,b){return "their digits add to "+digitSum(a)+" and "+digitSum(b)+", both multiples of 3";},
         no:function(n){return "the digits of "+n+" add to "+digitSum(n)+", not a multiple of 3";}},
    {p:5,both:function(a,b){return "both end in 0 or 5";},
         no:function(n){return n+" ends in "+String(n).slice(-1);}},
    {p:7,both:function(a,b){return "counting by 7s reaches both";},
         no:function(n){return "counting by 7s skips "+n;}},
    {p:11,both:function(a,b){return "counting by 11s reaches both";},
          no:function(n){return "counting by 11s skips "+n;}},
    {p:13,both:function(a,b){return "counting by 13s reaches both";},
          no:function(n){return "counting by 13s skips "+n;}}
];
/* try the rules in order, stop at the first one that fits, and name it.
   What it divides to is deliberately left blank. */
function ruleScan(a,b){
    let out="";
    for(let i=0;i<RULES.length;i++){
        const r=RULES[i];
        if(a%r.p===0&&b%r.p===0){
            out+='<div>'+r.p+'? '+r.both(a,b)+' \u2014 so <b>'+r.p+'</b> goes into both. '+
                 'your turn: what does each one become?</div>';
            return out;
        }
        out+='<div>'+r.p+'? '+r.no(a%r.p!==0?a:b)+'</div>';
    }
    out+='<div>nothing small fits \u2014 these two are already as low as they go</div>';
    return out;
}

/* ---------- the ladder ----------
   Two numbers side by side inside an L, a shared factor pulled out to the
   left, the quotients written underneath, again and again until nothing is
   left in common.  Drawn the same way as the ladder in the adding-and-
   subtracting drill so it is the same object in both places.  The student
   drives every square of it; the ladder only checks.  One rung at a time
   means 16 and 24 never needs anybody to know the rule for 8 - three twos
   get there just as well. */
function startLadder(host,a0,b0){
    const wrap=document.createElement("div");wrap.className="ladwrap";
    wrap.innerHTML='<div class="ladtag">ladder</div><div class="lad"></div>'+
                   '<div class="ladnote"></div>';
    host.appendChild(wrap);
    const lad=wrap.querySelector(".lad"), note=wrap.querySelector(".ladnote");

    const rows=[{f:null,a:a0,b:b0}];
    let phase=gcd(a0,b0)>1?"f":"done";
    let nudge=null;
    const last=function(){return rows[rows.length-1];};
    const prev=function(){return rows[rows.length-2];};
    const factors=function(){
        return rows.filter(function(r){return r.f!==null;}).map(function(r){return r.f;});
    };
    function say(html){note.innerHTML=html||"";}

    function draw(){
        let html="";
        rows.forEach(function(r,i){
            const isLast=i===rows.length-1;
            const slot='<span class="lslot"></span>';
            /* the dividing stops when the two numbers share nothing but 1, so a
               1 is written on the outside of that last rung: the ladder says
               why it ended instead of just ending */
            const oneOut=isLast&&phase==="done";
            const f=r.f!==null?'<span class="lnum">'+r.f+'</span>'
                              :(isLast&&phase==="f"?slot
                              :(oneOut?'<span class="lnum one">1</span>':""));
            function num(v,which){
                if(isLast&&phase===which) return '<span class="lc">'+slot+'</span>';
                if(v===null) return '<span class="lc"></span>';
                return '<span class="lc"><span class="lnum'+
                       (isLast&&phase==="done"?" hot":"")+'">'+v+'</span></span>';
            }
            /* a row keeps its bracket while it is still the row being divided */
            const boxed=!isLast||phase==="f"||rows.length===1;
            html+='<div class="lrow"><span class="lf">'+f+'</span>'+
                  '<span class="lnums'+(boxed?" box":"")+'">'+num(r.a,"a")+
                  '<span class="lgap"></span>'+num(r.b,"b")+'</span></div>';
        });
        lad.innerHTML=html;
        place();
        if(phase==="done") settled();
    }

    /* one live box at a time, dropped into whichever slot is being asked for */
    function place(){
        const slot=wrap.querySelector(".lslot");
        if(!slot) return;
        const el=document.createElement("input");
        el.type="text";el.inputMode="numeric";el.autocomplete="off";el.className="lbox";
        slot.replaceWith(el);
        el.oninput=function(){read(el);};
        el.focus();
    }

    function read(el){
        clearTimeout(nudge);
        const raw=el.value.replace(/[^0-9]/g,"");
        if(el.value!==raw) el.value=raw;
        const v=raw===""?null:parseInt(raw,10);
        if(v===null){say("");return;}
        const r=last();

        if(phase==="f"){
            if(v>1&&r.a%v===0&&r.b%v===0){
                say("");el.disabled=true;
                r.f=v;rows.push({f:null,a:null,b:null});phase="a";later(draw,220);
            }else{
                nudge=setTimeout(function(){say(ruleScan(r.a,r.b));},1600);
            }
            return;
        }
        if(phase==="a"){
            if(v===prev().a/prev().f){r.a=v;phase="b";say("");draw();}
            else nudge=setTimeout(function(){
                say('<div>how many '+prev().f+'s are in '+prev().a+'?</div>');},1900);
            return;
        }
        if(phase==="b"){
            if(v===prev().b/prev().f){
                r.b=v;
                phase=gcd(r.a,r.b)>1?"f":"done";
                say(phase==="f"?'<div>'+r.a+' and '+r.b+' still share something - keep going.</div>':"");
                draw();
            }else nudge=setTimeout(function(){
                say('<div>how many '+prev().f+'s are in '+prev().b+'?</div>');},1900);
        }
    }

    function settled(){
        const r=last(), used=factors();
        let h='<div><b>'+r.a+'</b> and <b>'+r.b+'</b> are as low as they go.</div>';
        if(used.length>1)
            h+='<div class="gcf">down the side: '+used.join(" "+TIMES+" ")+
               " = "+used.reduce(function(p,q){return p*q;},1)+
               ", the one number you could have divided by all at once.</div>";
        say(h);
    }

    draw();
    return {el:wrap,stop:function(){clearTimeout(nudge);}};
}

/* ---------- which kind of help a pair gets ----------
   The ladder is for numbers nobody can take apart in their head: 129 and 15
   is a real question, and climbing down it is worth the room it takes up.
   For ordinary numbers it is too much apparatus for too little - so the help
   there just names the factor and hands the dividing back. */
function bigPair(a,b){return Math.max(a,b)>=50&&Math.min(a,b)>=10;}

/* the quiet button that helps with whichever pair is live, and takes the help
   away again the moment that pair is finished with */
function cancelHelp(line,getPair){
    const btn=document.createElement("button");
    btn.type="button";btn.className="help";btn.textContent="show me how";
    btn.onmousedown=function(e){e.preventDefault();};
    let host=null, lad=null;
    function close(){
        if(lad) lad.stop();
        if(host) host.remove();
        host=null;lad=null;btn.textContent="show me how";
    }
    btn.onclick=function(){
        if(host){close();return;}
        const p=getPair();
        if(!p) return;
        stat.helps++;
        host=document.createElement("div");
        line.querySelector(".body").appendChild(host);
        const a=p[0],b=p[1],g=gcd(a,b);
        if(bigPair(a,b)&&g>1){
            lad=startLadder(host,a,b);
            btn.textContent="hide";
        }else{
            /* the factor, said outright, and the dividing left to them */
            host.className="guide";
            host.innerHTML='<div class="beat"><b>'+g+'</b> goes into both '+a+
                ' and '+b+'. divide each of them by '+g+' and write what they become.</div>';
            btn.textContent="hide";
        }
        later(function(){host.scrollIntoView({block:"nearest",behavior:"smooth"});},80);
        const open=[].slice.call(line.querySelectorAll(".cbox,.blank"))
                     .filter(function(x){return !x.disabled;})[0];
        if(open&&!(lad)) open.focus();
    };
    line.querySelector(".expr").appendChild(btn);
    return {close:close,drop:function(){close();btn.remove();}};
}

/* ---------- lining one line up under the line above it ----------
   What has to sit in a column is the whole term, not the fraction inside it.
   Measuring the fraction bars was what threw the improper line out: the bar
   of a mixed number like -1 1/4 is well to the right of where the number
   starts, so the fraction it turns into was pushed out past the divide sign
   and left a hole in the middle of the line.  Terms and signs are matched up
   in order instead, so 5/4 lands under the -1 1/4 it came from and the sign
   between them stays where it was written.

   Margins are cleared first, so this can be run again after a blank has been
   replaced by the number that went in it without the shifts piling up. */
function slotsOf(expr){
    return [].slice.call(expr.children).filter(function(x){
        return x.classList.contains("term")||x.classList.contains("op");
    });
}
function curZoom(){
    const z=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--z"));
    return z>0?z:1;
}
function alignUnder(line){
    const prev=line.previousElementSibling;
    if(!prev) return;
    const pe=prev.querySelector(".expr"), ce=line.querySelector(".expr");
    if(!pe||!ce) return;
    const A=slotsOf(pe), B=slotsOf(ce);
    if(!A.length||A.length!==B.length) return;
    const z=curZoom();
    B.forEach(function(x){x.style.marginLeft="";});
    const base=pe.getBoundingClientRect().left, mine=ce.getBoundingClientRect().left;
    for(let i=0;i<B.length;i++){
        const want=A[i].getBoundingClientRect().left-base;
        const have=B[i].getBoundingClientRect().left-mine;
        const d=(want-have)/z;
        if(d>0.5) B[i].style.marginLeft=d+"px";
    }
}

/* the mixed number with the two arrows on it, the way it gets drawn on paper */
let drawId=0;
function mixedArrows(w,n,d){
    const id="ah"+(++drawId);
    return '<svg class="draw" viewBox="12 20 156 116" xmlns="http://www.w3.org/2000/svg">'+
      '<defs><marker id="'+id+'" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" '+
        'markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--pencil)"/></marker></defs>'+
      '<g font-family="Georgia,serif" font-size="31" fill="var(--ink)" text-anchor="middle">'+
        '<text x="30" y="70">'+w+'</text>'+
        '<text x="80" y="52">'+n+'</text>'+
        '<text x="80" y="90">'+d+'</text>'+
      '</g>'+
      '<line x1="55" y1="60" x2="105" y2="60" stroke="var(--ink)" stroke-width="2"/>'+
      '<g fill="none" stroke="var(--pencil)" stroke-width="2.4" stroke-linecap="round" '+
        'marker-end="url(#'+id+')">'+
        '<path d="M22 80 C 18 110, 56 118, 78 102"/>'+          /* multiply: whole to bottom */
        '<path d="M112 92 C 142 86, 144 44, 112 36"/>'+         /* add: bottom to top */
      '</g>'+
      '<g font-family="Georgia,serif" font-size="20" fill="var(--pencil)" text-anchor="middle">'+
        '<text x="34" y="126">'+TIMES+'</text>'+
        '<text x="152" y="40">+</text>'+
      '</g>'+
      '</svg>';
}

/* the same mixed number with the bottom number ringed */
function circledDen(w,n,d){
    const rx=String(d).length>1?26:20;
    return '<svg class="draw ring" viewBox="12 22 104 86" xmlns="http://www.w3.org/2000/svg">'+
      '<g font-family="Georgia,serif" font-size="31" fill="var(--ink)" text-anchor="middle">'+
        '<text x="30" y="70">'+w+'</text>'+
        '<text x="80" y="52">'+n+'</text>'+
        '<text x="80" y="90">'+d+'</text>'+
      '</g>'+
      '<line x1="55" y1="60" x2="105" y2="60" stroke="var(--ink)" stroke-width="2"/>'+
      '<ellipse cx="80" cy="81" rx="'+rx+'" ry="16" transform="rotate(-8 80 81)" '+
        'fill="none" stroke="var(--pencil)" stroke-width="2.4"/>'+
      '</svg>';
}

/* a line of multiples, with the last one that still fits marked */
function countRow(d,limit){
    const top=Math.floor(limit/d),count=Math.max(3,top+1);
    let s=d+": ";
    for(let k=1;k<=count;k++){
        const v=d*k;
        s+=(k===top?"<b>"+v+"</b>":v)+(k<count?" &nbsp;":"");
    }
    return '<div class="rows"><div>'+s+'</div></div>';
}

/* ============================ how the problem is written ============================ */
function operandHTML(i,withSign){
    const m=i===1?P.isMixed1:P.isMixed2;
    const w=i===1?P.w1:P.w2, n=i===1?P.n1:P.n2, d=i===1?P.d1:P.d2;
    const neg=withSign&&((i===1?P.s1:P.s2)<0);
    if(m) return termHTML((neg?MINUS:"")+w,String(n),String(d));
    /* a whole number is written whole; the flip step turns it into n/1 */
    if(d===1) return '<span class="term whole">'+(neg?MINUS:"")+n+'</span>';
    return '<span class="term">'+(neg?'<span class="lead">'+MINUS+'</span>':"")+
           fracHTML(String(n),String(d))+'</span>';
}
function problemHTML(){
    return operandHTML(1,true)+opHTML(DIV)+operandHTML(2,true);
}
/* the answer, with its sign attached, once the sign has been settled */
function finalAnswerHTML(){
    const m=P.neg?'<span class="lead">'+MINUS+'</span>':"";
    if(P.needsRegroup)
        return '<span class="term">'+m+'<span class="whole">'+P.whole+'</span>'+
               fracHTML(String(P.rem),String(P.simpDen))+'</span>';
    if(P.simpDen===1) return '<span class="term">'+m+P.simpNum+'</span>';
    return '<span class="term">'+m+fracHTML(String(P.simpNum),String(P.simpDen))+'</span>';
}

/* the same two things again in plain text, for the sheet that gets handed in */
function operandText(i){
    const m=i===1?P.isMixed1:P.isMixed2;
    const w=i===1?P.w1:P.w2, n=i===1?P.n1:P.n2, d=i===1?P.d1:P.d2;
    const sg=(i===1?P.s1:P.s2)<0?"-":"";
    if(m) return sg+w+" "+n+"/"+d;
    if(d===1) return sg+n;
    return sg+n+"/"+d;
}
function problemText(){return operandText(1)+" \u00F7 "+operandText(2);}
function answerText(){
    const m=P.neg?"-":"";
    if(P.needsRegroup) return m+P.whole+" "+P.rem+"/"+P.simpDen;
    if(P.simpDen===1) return m+P.simpNum;
    return m+P.simpNum+"/"+P.simpDen;
}

/* ============================ steps ============================ */
/* the last thing you settle: look back at the two signs and say what the answer is */
function stepSign(){
    const line=addLine("sign",eqHTML()+
        '<button class="sbtn" data-s="p">+</button><button class="sbtn" data-s="n">'+MINUS+'</button>');
    const want=P.neg?"n":"p";
    line.querySelectorAll(".sbtn").forEach(function(b){
        b.onclick=function(){
            if(b.dataset.s!==want){
                b.classList.add("no");
                setTimeout(function(){b.classList.remove("no");},350);
                return;
            }
            line.querySelectorAll(".sbtn").forEach(function(x){x.disabled=true;x.onclick=null;});
            line.querySelector(".expr").innerHTML=eqHTML()+finalAnswerHTML();
            later(nextStep,300);
        };
    });
}

/* ---------- mixed numbers into improper fractions ----------
   One number at a time.  The line is written out underneath the problem with
   a blank fraction standing where each mixed number was, and the mixed number
   being worked on is lit up above it, so the fraction that gets written lands
   directly under the number it came from.  Only when the first one is finished
   does the second one open, which is the order it would be done in on paper -
   the old version converted both at once off in the margin and then produced
   a whole new line, so the two numbers seemed to change in one jump. */
function stepImproper(){
    const jobs=[];
    let html="";
    for(let i=1;i<=2;i++){
        const m=i===1?P.isMixed1:P.isMixed2;
        const w=i===1?P.w1:P.w2, n=i===1?P.n1:P.n2, d=i===1?P.d1:P.d2;
        const num=i===1?P.num1:P.num2, den=i===1?P.den1:P.den2;
        if(m){
            const f=fracHTML(blank(52),blank(52));
            jobs.push({i:i,w:w,n:n,d:d,num:num,den:den,
                       nId:"k"+(boxId-1),dId:lastId(),box:null,step:0});
            html+='<span class="term" id="im'+i+'">'+f+'</span>';
        }else{
            html+='<span class="term" id="im'+i+'">'+fracHTML(String(num),String(den))+'</span>';
        }
        if(i===1) html+=opHTML(DIV);
    }

    const line=addLine("improper",html);
    alignUnder(line);

    /* the mixed number being worked on, marked on the problem line above */
    const src=line.previousElementSibling;
    function litSrc(i){
        if(!src) return;
        src.querySelectorAll(".term").forEach(function(t){t.classList.remove("lit");});
        if(i){
            const t=src.querySelectorAll(".term")[i-1];
            if(t) t.classList.add("lit");
        }
    }

    /* the finished fraction, written in place of the blanks it was typed into */
    function settle(j){
        const slot=line.querySelector("#im"+j.i);
        if(slot) slot.innerHTML=fracHTML(String(j.num),String(j.den));
        litSrc(null);
        alignUnder(line);
    }

    /* one quiet button; it explains whichever number is being worked on */
    let cur=null;
    const btn=document.createElement("button");
    btn.type="button";btn.className="help";btn.textContent="show me how";
    btn.onmousedown=function(e){e.preventDefault();};
    function refresh(){
        if(!cur) return;
        btn.style.display=cur.step<cur.beats.length?"":"none";
        btn.textContent=cur.step?"next":"show me how";
    }
    btn.onclick=function(){
        const j=cur;
        if(!j) return;
        if(!j.box){
            j.box=document.createElement("div");j.box.className="guide";
            line.querySelector(".body").appendChild(j.box);
        }
        stat.helps++;
        j.box.insertAdjacentHTML("beforeend",'<div class="beat">'+j.beats[j.step++]+'</div>');
        refresh();
        const open=[].slice.call(line.querySelectorAll("input")).filter(function(x){return !x.disabled;})[0];
        if(open) open.focus();
    };
    line.querySelector(".expr").appendChild(btn);

    const specs=[];
    jobs.forEach(function(j){
        const prod=j.w*j.d;
        /* both halves of the conversion in one beat: the arrows that build the
           new top, and the ring round the bottom that stays put */
        j.beats=[
            '<div class="pair">'+
                '<div><div class="cap">the new top</div>'+
                    '<div>bottom times the whole, then add the top</div>'+
                    mixedArrows(j.w,j.n,j.d)+
                    '<div class="eqline">'+j.w+' '+TIMES+' '+j.d+' + '+j.n+' =</div></div>'+
                '<div><div class="cap">the new bottom</div>'+
                    '<div>the denominator does not change</div>'+
                    circledDen(j.w,j.n,j.d)+'</div>'+
            '</div>',
            '<div>'+j.w+' '+TIMES+' '+j.d+' = '+prod+', and '+prod+' + '+j.n+
                ' = <b>'+j.num+'</b>, all of it still over '+j.d+'</div>'+
                (j.w>1?countRow(j.d,prod):"")
        ];
        specs.push({id:j.nId,ans:j.num,
            show:function(){cur=j;litSrc(j.i);refresh();},
            hints:[{t:j.w+" "+TIMES+" "+j.d+" + "+j.n},{t:"= "+j.num}]});
        specs.push({id:j.dId,ans:j.den,
            show:function(){cur=j;refresh();},
            ok:function(){settle(j);},
            hints:[{t:"keep the same denominator"},{t:"= "+j.den}]});
    });

    runBoxes(line,specs,function(){
        btn.remove();
        litSrc(null);
        /* the scratch work has done its job; clearing it keeps keep-change-flip
           within arm's reach instead of a scroll away */
        line.querySelectorAll(".guide").forEach(function(g){g.remove();});
        alignUnder(line);
        later(nextStep,420);
    });
}

/* keep, change, flip: one tap each, then the reciprocal is written in */
function stepFlip(){
    const html='<span class="term tok" id="tKeep">'+fracHTML(String(P.num1),String(P.den1))+'</span>'+
        '<span class="op" id="tOp">'+DIV+'</span>'+
        '<span class="term" id="tSecond">'+fracHTML(String(P.num2),String(P.den2))+'</span>';
    const line=addLine("keep",html);
    alignUnder(line);
    const tag=line.querySelector(".tag"), note=line.querySelector(".note");
    const keep=line.querySelector("#tKeep"), op=line.querySelector("#tOp");
    const second=line.querySelector("#tSecond");

    note.textContent="tap the fraction you keep";note.classList.add("show");

    keep.onclick=function(){
        keep.onclick=null;
        keep.classList.remove("tok");keep.classList.add("used");
        tag.textContent="change";
        note.textContent="tap the sign";
        op.classList.add("tok");
        op.onclick=function(){
            op.onclick=null;
            op.classList.remove("tok");op.classList.add("used");
            if(!CALM) op.classList.add("swap");
            later(function(){op.textContent=TIMES;},CALM?0:200);
            later(writeReciprocal,CALM?0:470);
        };
    };

    function writeReciprocal(){
        tag.textContent="flip";
        note.textContent="";note.classList.remove("show");
        second.innerHTML=fracHTML(blank(52),blank(52));
        const nId="k"+(boxId-1), dId=lastId();
        runBoxes(line,[
            {id:nId,ans:P.flipNum,hints:[
                {t:"turn "+P.num2+"/"+P.den2+" over"},{t:"= "+P.flipNum}]},
            {id:dId,ans:P.flipDen,hints:[{t:"= "+P.flipDen}]}
        ],function(){
            line.querySelectorAll(".used").forEach(function(e){e.classList.remove("used");});
            nextStep();
        });
    }
}

function stepCancel(){
    function cell(topId,top,botId,bot,topBox,botBox){
        return '<span class="term"><span class="frac">'+
               '<span class="frac-num"><span class="dig" id="'+topId+'">'+top+'</span>'+
               (topBox?'<span class="over">'+cbox()+'</span>':"")+'</span>'+
               '<span class="frac-den"><span class="dig" id="'+botId+'">'+bot+'</span>'+
               (botBox?'<span class="under">'+cbox()+'</span>':"")+'</span></span></span>';
    }
    /* left fraction: numerator boxed with pair 1, denominator boxed with pair 2 */
    let html=cell("dA",P.num1,"dB",P.den1,P.g1>1,false);
    const aId=P.g1>1?lastId():null;
    html+=opHTML(TIMES);
    html+=cell("dC",P.flipNum,"dD",P.flipDen,P.g2>1,P.g1>1);
    const cIds=[];
    if(P.g2>1) cIds.push("k"+(boxId-(P.g1>1?1:0)));
    if(P.g1>1) cIds.push(lastId());

    const line=addLine("cancel",html,"cancel");
    alignUnder(line);

    /* the left denominator needs its own box, added after the line exists */
    let bId=null;
    if(P.g2>1){
        const den=line.querySelector("#dB").parentNode;
        den.insertAdjacentHTML("beforeend",'<span class="under">'+cbox()+'</span>');
        bId=lastId();
    }

    /* whichever pair is live, so the ladder knows what to work on */
    let pair=null, helper=null;

    const specs=[];
    if(P.g1>1){
        const dId=cIds[cIds.length-1];
        specs.push({id:aId,ans:P.redNum1,
            show:function(){
                litOnly(line,["dA","dD"]);
                pair=[P.num1,P.flipDen];
                if(helper) helper.close();
            },
            ok:function(){document.getElementById("dA").classList.add("struck");},
            hints:[{t:P.num1+" and "+P.flipDen+" are both "+DIV+" "+P.g1},
                   {t:"so how many "+P.g1+"s are in "+P.num1+"?"}]});
        specs.push({id:dId,ans:P.redFlipDen,
            ok:function(){document.getElementById("dD").classList.add("struck");},
            hints:[{t:"now the bottom one, "+P.flipDen+" "+DIV+" "+P.g1},
                   {t:"how many "+P.g1+"s are in "+P.flipDen+"?"}]});
    }
    if(P.g2>1){
        specs.push({id:cIds[0],ans:P.redFlipNum,
            show:function(){
                litOnly(line,["dC","dB"]);
                pair=[P.flipNum,P.den1];
                if(helper) helper.close();
            },
            ok:function(){document.getElementById("dC").classList.add("struck");},
            hints:[{t:P.flipNum+" and "+P.den1+" are both "+DIV+" "+P.g2},
                   {t:"so how many "+P.g2+"s are in "+P.flipNum+"?"}]});
        specs.push({id:bId,ans:P.redDen1,
            ok:function(){document.getElementById("dB").classList.add("struck");},
            hints:[{t:"now the other one, "+P.den1+" "+DIV+" "+P.g2},
                   {t:"how many "+P.g2+"s are in "+P.den1+"?"}]});
    }

    helper=cancelHelp(line,function(){return pair;});

    runBoxes(line,specs,function(){
        helper.drop();
        litOnly(line,null);
        nextStep();
    });
}

/* ---------- multiplying ----------
   Across the top first, then along the bottom.  Whichever pair is being
   multiplied is lit up while its box is open, so there is never a question
   about which two numbers the box is asking for. */
function stepMultiply(){
    function mf(nId,n,dId,d){
        return '<span class="term"><span class="frac">'+
               '<span class="frac-num"><span class="dig" id="'+nId+'">'+n+'</span></span>'+
               '<span class="frac-den"><span class="dig" id="'+dId+'">'+d+'</span></span>'+
               '</span></span>';
    }
    const html=mf("mA",P.redNum1,"mB",P.redDen1)+opHTML(TIMES)+
               mf("mC",P.redFlipNum,"mD",P.redFlipDen)+eqHTML()+
               fracHTML(blank(56),blank(56));
    const nId="k"+(boxId-1), dId=lastId();
    const line=addLine("multiply",html);
    alignUnder(line);
    runBoxes(line,[
        {id:nId,ans:P.rawNum,
            show:function(){litOnly(line,["mA","mC"]);},
            hints:[{t:P.redNum1+" "+TIMES+" "+P.redFlipNum},{t:"= "+P.rawNum}]},
        {id:dId,ans:P.rawDen,
            show:function(){litOnly(line,["mB","mD"]);},
            hints:[{t:P.redDen1+" "+TIMES+" "+P.redFlipDen},{t:"= "+P.rawDen}]}
    ],function(){
        litOnly(line,null);
        nextStep();
    });
}

function stepSimplify(){
    let html=termHTML("",String(P.rawNum),String(P.rawDen))+eqHTML();
    let nId,dId=null;
    if(P.simpDen===1){
        html+=blank(56);nId=lastId();
    }else{
        html+=fracHTML(blank(56),blank(56));
        nId="k"+(boxId-1);dId=lastId();
    }
    const line=addLine("simplify",html);
    const specs=[];
    if(P.simpDen===1){
        specs.push({id:nId,ans:P.simpNum,hints:[
            {t:P.rawNum+" "+DIV+" "+P.rawDen},
            {t:"how many "+P.rawDen+"s are in "+P.rawNum+"?"}]});
    }else{
        specs.push({id:nId,ans:P.simpNum,hints:[
            {t:"is there a number that goes into both "+P.rawNum+" and "+P.rawDen+"?"},
            {t:"both are "+DIV+" "+P.g+" \u2014 so how many "+P.g+"s are in "+P.rawNum+"?"}]});
        specs.push({id:dId,ans:P.simpDen,hints:[
            {t:"now the bottom, "+P.rawDen+" "+DIV+" "+P.g},
            {t:"how many "+P.g+"s are in "+P.rawDen+"?"}]});
    }
    let helper=null;
    if(P.g>1){
        helper=cancelHelp(line,function(){return [P.rawNum,P.rawDen];});
    }
    runBoxes(line,specs,function(){
        if(helper) helper.drop();
        nextStep();
    });
}

/* The long division on its own, with the two arrows that carry the answer:
   the quotient down to the remainder, and the remainder across to the divisor. */
function divArrows(num,den,whole,prod,rem){
    const id="dv"+(++drawId);
    const wide=Math.max(String(num).length,String(prod).length);
    const xL=72, xR=xL+wide*17+16, xA=xR-8;
    const rx=xA-String(rem).length*17;
    const dx=58-String(den).length*8.5;   /* the middle of the divisor */
    return '<svg class="draw dv" viewBox="6 18 '+(xR+62-6)+' 198" xmlns="http://www.w3.org/2000/svg">'+
      '<defs><marker id="'+id+'" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" '+
        'markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--pencil)"/></marker></defs>'+
      '<g font-family="Georgia,serif" font-size="30" fill="var(--ink)" text-anchor="end">'+
        '<text x="'+xA+'" y="42">'+whole+'</text>'+
        '<text x="58" y="88">'+den+'</text>'+
        '<text x="'+xA+'" y="88">'+num+'</text>'+
        '<text x="'+(xA-wide*17-3)+'" y="124">'+MINUS+'</text>'+
        '<text x="'+xA+'" y="124">'+prod+'</text>'+
        '<text x="'+xA+'" y="170">'+rem+'</text>'+
      '</g>'+
      '<path d="M'+(xL-6)+' 102 Q'+(xL+9)+' 78 '+(xL-6)+' 54 L'+xR+' 54" '+
        'fill="none" stroke="var(--ink)" stroke-width="2"/>'+
      '<line x1="'+(xL+2)+'" y1="136" x2="'+xR+'" y2="136" stroke="var(--ink)" stroke-width="2"/>'+
      '<g fill="none" stroke="var(--pencil)" stroke-width="2.4" stroke-linecap="round" '+
        'marker-end="url(#'+id+')">'+
        '<path d="M'+(xR+14)+' 34 C'+(xR+54)+' 62, '+(xR+54)+' 136, '+(xR+16)+' 157"/>'+
        '<path d="M'+(rx-6)+' 176 C'+(xL-28)+' 200, 14 168, '+dx+' 104"/>'+
      '</g>'+
      '</svg>';
}

function stepMixed(){
    const num=P.simpNum, den=P.simpDen, prod=P.whole*den;
    const html=termHTML("",String(num),String(den))+eqHTML()+
               blank(46)+" "+fracHTML(blank(56),String(den));
    const wId="k"+(boxId-1), nId=lastId();
    const line=addLine("mixed",html);
    helpButton(line,[divArrows(num,den,P.whole,prod,P.rem)]);
    runBoxes(line,[
        {id:wId,ans:P.whole,hints:[
            {t:num+" "+DIV+" "+den},{t:"= "+P.whole+" and some left over"}]},
        {id:nId,ans:P.rem,hints:[
            {t:"what is left over"},{t:num+" "+MINUS+" "+prod+" = "+P.rem}]}
    ],nextStep);
}

/* ============================ flow ============================ */
const STEP={sign:stepSign,improper:stepImproper,flip:stepFlip,cancel:stepCancel,
            multiply:stepMultiply,simplify:stepSimplify,mixed:stepMixed};

function buildSequence(){
    const s=[];
    if(P.hasMixed) s.push("improper");
    s.push("flip");
    if(P.g1>1||P.g2>1) s.push("cancel");
    s.push("multiply");
    if(P.needsSimplify) s.push("simplify");
    if(P.needsRegroup) s.push("mixed");
    s.push("sign");
    return s;
}
function goStep(i){seqIdx=i;resetHints();STEP[seq[i]]();}
function nextStep(){
    if(seqIdx+1<seq.length) goStep(seqIdx+1);
    else finish();
}

function finish(){
    const lines=sheet.querySelectorAll(".line");
    lines[lines.length-1].classList.add("answer");
    const b=document.createElement("div");
    b.className="line in";
    b.innerHTML='<span class="tag"></span><div class="body"><button class="next" id="nextBtn">next</button></div>';
    sheet.appendChild(b);
    later(function(){b.scrollIntoView({block:"nearest",behavior:"smooth"});},60);
    wpDone=true;wpRender();
    finished=true;

    session.records.push({
        q:problemText(),a:answerText(),
        hints:stat.hints,helps:stat.helps,kind:fromRound?"round":kind,
        clean:(stat.hints===0&&stat.helps===0)
    });
    updateTally();

    /* At the end of the round the same button carries on to the form instead
       of to another problem.  The card is raised by nextProblem rather than on
       a timer here, so pressing next straight away cannot outrun it. */
    const last=(!endless&&solved>=TARGET);
    const nb=document.getElementById("nextBtn");
    nb.textContent=last?"finish \u2014 enter your name":"next";
    nb.onclick=nextProblem;
}

/* whether the problem on the sheet right now came out of the set of ten, so
   the record can say which is which after everything is over */
let fromRound=false;

function initProblem(){
    stat={hints:0,helps:0};
    /* the set of ten comes first, in order.  Once it is behind them, roughly
       one problem in three comes from the list of word problems and brings its
       own numbers; the rest are generated, and get no panel. */
    const fixed=roundItem();
    fromRound=!!fixed;
    let story;
    if(fixed){
        story=fixed.s?fixed:null;
        problemCount=session.records.length+1;
        P=buildP(fixed.x.n,fixed.x.d,fixed.y.n,fixed.y.d,
                 !!fixed.x.m,!!fixed.y.m,fixed.x.s,fixed.y.s);
    }else{
        story=(Math.random()<0.34)?wpDraw():null;
        P=story?buildP(story.x.n,story.x.d,story.y.n,story.y.d,
                       !!story.x.m,!!story.y.m,story.x.s,story.y.s)
               :generateProblem();
    }
    updateLocks();
    finished=false;boxId=0;epoch++;resetHints();hintEl=null;
    sheet.innerHTML="";
    wpSet(story);
    seq=buildSequence();
    addLine(problemCount+".",problemHTML());
    goStep(0);
    window.scrollTo(0,0);
}

let lastAdvance=0;
function nextProblem(){
    const now=Date.now();
    if(now-lastAdvance<350) return;
    lastAdvance=now;
    /* ten done, and they have not already chosen to keep going: the form */
    if(!endless&&solved>=TARGET){showSubmitCard(true);return;}
    problemCount++;
    initProblem();
}

/* ============================ turning it in ============================
   The same submission the rest of the study guide uses: one Google Form,
   period and the two names read back before anything is sent, and the drill
   waiting underneath for whoever wants to carry on.

   The names here are the ones the shell's bridge script looks for, so this
   sheet can be dropped into the combined page beside the other drills and
   report itself without being touched: solved, cleanSolves, TARGET, endless,
   submitted, showSubmitCard(), submitEarly(), keepDrilling(), newProblem(),
   and the ids submitCard, submitEarlyBtn, gform, studentName, formScore. */
var DRILL_NAME = "Dividing Fractions \u2014 Study Guide";
var TARGET = 10;
var solved = 0, cleanSolves = 0, bestStreak = 0, endless = false, submitted = false;
/* how many problems were on the sheet the last time something was sent, so a
   student who turns in early and then keeps going can send the rest too */
var submittedAt = 0;

function el(id){return document.getElementById(id);}

/* the record kept fresh, so the shell can read it off at any moment */
function updateTally(){
    solved=session.records.length;
    cleanSolves=0;bestStreak=0;
    let run=0;
    session.records.forEach(function(r){
        if(r.clean){cleanSolves++;run++;if(run>bestStreak)bestStreak=run;}
        else run=0;
    });
    updateLocks();
}

/* ---------- what is available, and when ----------
   While the set of ten is still owed there is nothing to choose: no skipping
   a problem you would rather not do, no switching to an easier skill, and
   nothing to turn in yet.  The keys stay on the bar the whole time, dimmed,
   with the count beside them saying why \u2014 a key that vanishes and comes back
   is more confusing than one that is plainly waiting.  When the ten are done
   every one of them opens up and stays open. */
function updateLocks(){
    const left=roundLeft(), lock=inRound();
    document.querySelectorAll(".tools button[data-kind]").forEach(function(b){
        b.classList.toggle("mute",lock);
    });
    el("skip").classList.toggle("mute",lock);
    /* turning in is never locked.  Skipping a problem you would rather not do
       is one thing; running out of time is another, and a student who has to
       hand in four of the ten needs those four to count. */
    el("submitEarlyBtn").classList.remove("mute");
    const tag=el("roundTag");
    tag.classList.toggle("done",left===0);
    if(lock)
        tag.textContent=left>0
            ? (session.records.length+1)+" of "+TARGET
            : "all "+TARGET+" done";
    else
        tag.textContent=submitted?"turned in":"practice";
}

/* the problem still open on the sheet when the bell goes: it counts as work
   done even though it has no answer yet, so it gets handed in as it stands */
const STEPNAME={improper:"changing to improper fractions",flip:"keep, change, flip",
    cancel:"cancelling",multiply:"multiplying",simplify:"simplifying",
    mixed:"writing it as a mixed number",sign:"deciding the sign"};
function inProgress(){
    if(finished||!seq.length||!P||P.den1===undefined) return null;
    return {q:problemText(),step:STEPNAME[seq[seqIdx]]||seq[seqIdx]};
}

/* how many of each kind were worked, for the teacher's line on the form */
function breakdown(){
    const n={round:0,fractions:0,mixed:0,both:0};
    session.records.forEach(function(r){n[r.kind]=(n[r.kind]||0)+1;});
    const bits=[];
    if(n.round) bits.push("set "+n.round+"/"+TARGET);
    if(n.fractions) bits.push("F "+n.fractions);
    if(n.mixed) bits.push("MN "+n.mixed);
    if(n.both) bits.push("B "+n.both);
    return bits.join(", ");
}

function esc(t){
    return String(t).replace(/[&<>"]/g,function(c){
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
}

/* ---------- the card ---------- */
function cardShowing(){return el("submitCard").classList.contains("show");}
/* the sheet and the card take turns; the corner keys go away with the sheet,
   because everything they do has a plain button on the card instead */
function setCard(on){
    el("submitCard").classList.toggle("show",on);
    el("drillMain").style.display=on?"none":"";
    document.body.classList.toggle("oncard",on);
}

function showSubmitCard(completed){
    updateTally();
    clearHint();resetHints();
    setCard(true);

    el("submitTitle").textContent=completed
        ? "All "+TARGET+" done \u2014 "+solved+" problems solved"
        : solved+(solved===1?" problem solved":" problems solved");
    el("submitNote").textContent=completed
        ? "That is the whole set. Enter your period and name to submit. Nothing stops here \u2014 skip, the skill keys and the word problems are all open now, so keep practicing as long as you like."
        : "Enter your period and name to submit what you have so far. Nothing is lost by doing this \u2014 go back afterwards, carry on with the set, and send it again if you get further.";

    /* Only the count of work done is shown here.  The streak and the clean
       solves still go up with the submission - the teacher gets both on the
       form - but a scoreboard is the wrong thing to put in front of somebody
       who has just spent ten problems being careful. */
    el("recap").innerHTML='<div>Problems worked<b>'+solved+'</b></div>';

    /* every problem worked, in order, with the one still open at the end */
    const open=inProgress();
    let log="";
    if(session.records.length||open){
        log='<div class="log">';
        session.records.forEach(function(r,i){
            const marks=[];
            if(r.hints) marks.push(r.hints+" hint"+(r.hints>1?"s":""));
            if(r.helps) marks.push(r.helps+" example"+(r.helps>1?"s":""));
            log+='<div class="logrow"><span class="logn">'+(i+1)+'.</span>'+
                 '<span class="logq">'+esc(r.q)+' = '+esc(r.a)+'</span>'+
                 '<span class="logh">'+(marks.length?marks.join(", "):"on your own")+'</span></div>';
        });
        if(open)
            log+='<div class="logrow"><span class="logn">'+(solved+1)+'.</span>'+
                 '<span class="logq">'+esc(open.q)+'</span>'+
                 '<span class="logh">still on '+open.step+'</span></div>';
        log+='</div>';
    }else{
        log='<div class="logempty">Nothing finished yet \u2014 work goes in here as you go.</div>';
    }
    el("workLog").innerHTML=log;

    /* Turning in early does not close the sheet.  If they carry on afterwards
       and get further, the form comes back so the fuller sheet can be sent as
       well; the teacher takes the later one. */
    const more=submitted&&solved>submittedAt;
    el("gform").style.display=(!submitted||more)?"":"none";
    const btn=document.querySelector("#gform .submit-btn");
    if(more){
        el("formFeedback").innerHTML=
            '<span class="resend">You turned in '+submittedAt+' \u2014 you have '+
            solved+' now. Send it again and the newer one counts.</span>';
        btn.textContent="Send updated results";
    }else if(!submitted){
        el("formFeedback").innerHTML="";
        btn.textContent="Submit Results";
    }

    /* mid-set, the only thing on offer underneath is going back to the set:
       the skill keys are still the set's to hold */
    const mid=roundLeft()>0;
    document.querySelectorAll(".after-submit [data-go]").forEach(function(b){
        b.classList.toggle("mute",mid);
    });
    document.querySelector(".after-submit .lab").textContent=
        mid?("still "+roundLeft()+" left in the set:"):"keep practicing:";
    el("keepBtn").textContent=mid?"go back and carry on":"back to this one";

    el("formScore").value=solved;
    try{window.scrollTo(0,0);}catch(e){}
}

/* Called by the turn-in key and by the shell when the bell goes.  Whatever is
   on the sheet at that moment goes in, finished set or not. */
function submitEarly(){
    updateTally();
    showSubmitCard(roundLeft()===0);
}

/* Going back to work only switches off the round prompt once the round has
   actually been reached.  Turning in early and carrying on must not cost
   somebody the ten-problem card they never got to. */
function resumeDrill(){
    if(solved>=TARGET) endless=true;
    setCard(false);
    updateLocks();
}
function keepDrilling(){
    resumeDrill();
    if(finished){
        /* they had already finished that one; give them a fresh problem */
        nextProblem();
    }else{
        const open=[].slice.call(document.querySelectorAll("#sheet input"))
                     .filter(function(x){return !x.disabled;})[0];
        if(open) open.focus();
    }
}
/* the shell says newProblem when it hands control back */
function newProblem(){nextProblem();}

function showSubmittedMessage(){
    el("formFeedback").innerHTML=
        '<span style="color:#3f7d55;font-weight:600;">Successfully submitted. '+
        'You can close this page, or keep practicing below.</span>';
    el("gform").style.display="none";
    updateLocks();
}
function onHiddenFrameLoad(){if(submitted) showSubmittedMessage();}

/* ---------- the two names, read back before anything is sent ----------
   Last and first get swapped constantly, so the form shows what it is about
   to send and makes them look at it once. */
function nameCheck(){
    const ln=el("lastName").value.trim(), fn=el("firstName").value.trim();
    function row(tag,val){
        return '<div class="row"><span class="tag">'+tag+'</span>'+
               '<span class="val'+(val?"":" empty")+'">'+(val?esc(val):"\u2014")+'</span></div>';
    }
    el("nameCheck").innerHTML=
        '<div class="checkhead">This is what will be sent \u2014 check it is the '+
        'right way round:</div>'+
        row("Last name",ln)+row("First name",fn)+
        row("Roll call",(ln&&fn)?ln+", "+fn:"");
}
["lastName","firstName"].forEach(function(id){
    el(id).addEventListener("input",nameCheck);
});
nameCheck();

/* One press sends it.  The read-back above the button is live, so the names
   have already been shown the right way round the whole time somebody was
   typing them; asking for a second press to confirm what is sitting there in
   front of them only made the button look broken the first time. */
el("gform").addEventListener("submit",function(e){
    const ln=el("lastName").value.trim(), fn=el("firstName").value.trim();
    updateTally();
    const bits=breakdown();
    el("studentName").value=
        "Period "+el("studentPeriod").value.trim()+
        " \u2014 "+ln+
        " \u2014 "+fn+
        " \u2014 "+cleanSolves+" clean solves"+
        " \u2014 "+DRILL_NAME+
        (bits?" ("+bits+")":"");
    el("formScore").value=solved;
    submitted=true;submittedAt=solved;
});

/* ---------- getting back to work ---------- */
el("keepBtn").onclick=keepDrilling;
document.querySelectorAll(".after-submit [data-go]").forEach(function(b){
    b.onclick=function(){
        resumeDrill();
        setKind(b.dataset.go);
    };
});
el("submitEarlyBtn").onclick=function(){
    if(cardShowing()) keepDrilling(); else submitEarly();
};

/* dimmed keys ignore a click on their own, but a tab and a return would still
   reach them, so the answer is no here as well */
document.getElementById("skip").onclick=function(){if(inRound())return;nextProblem();};
/* Enter moves the sheet on, but never while the form is up \u2014 there it
   belongs to the form */
document.addEventListener("keydown",function(e){
    if(cardShowing()) return;
    if(e.key==="Enter"&&finished){e.preventDefault();finished=false;nextProblem();}
});
/* ---------- bigger, smaller ---------- */
const SIZES=[0.8,0.9,1,1.15,1.35,1.6,1.9,2.2];
let sizeIdx=2;
const zIn=document.getElementById("zIn"), zOut=document.getElementById("zOut");
function applySize(){
    document.documentElement.style.setProperty("--z",SIZES[sizeIdx]);
    zIn.classList.toggle("mute",sizeIdx>=SIZES.length-1);
    zOut.classList.toggle("mute",sizeIdx<=0);
}
zIn.onclick=function(){if(sizeIdx<SIZES.length-1){sizeIdx++;applySize();}};
zOut.onclick=function(){if(sizeIdx>0){sizeIdx--;applySize();}};
applySize();

/* switching skill starts the numbering over, but the record carries on:
   whatever was worked through before is still there to be turned in */
function setKind(k){
    if(inRound()) return;          /* the set of ten is the set of ten */
    if(cardShowing()) setCard(false);
    kind=k;
    document.querySelectorAll(".tools button[data-kind]").forEach(function(x){
        x.classList.toggle("on",x.dataset.kind===k);
    });
    problemCount=1;
    initProblem();
}
document.querySelectorAll(".tools button[data-kind]").forEach(function(b){
    b.onclick=function(){setKind(b.dataset.kind);};
});

initProblem();
</script>
</body>
</html>
